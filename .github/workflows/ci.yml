name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by the deploy workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Browser tests (the Chrome on the runner, fake MusicBrainz)
        run: npm run test:e2e
