<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Album Poster</title>
        <link rel="icon" href="data:,">
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/style.css">
    </head>
    <body>
        <main>
            <section id="album-container" class="container">
                <p id="status" class="status hidden" role="status" aria-live="polite"></p>

                <!-- Album info -->
                <div id="album-info" class="album-info-container">
                    <div class="album-cover-wrapper">
                        <img id="album-cover" src="" alt="" crossorigin="anonymous">
                    </div>
                    <h2 id="album-name" class="album-name"></h2>
                    <div class="album-tracklist-genre-wrapper">
                        <div class="left">
                            <ol id="track-list" class="track-list"></ol>
                        </div>
                        <div class="right">
                            <div class="album-cover-back">
                                <img id="album-cover-back" src="" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="album-artist">
                        <div id="album-colors" class="album-colors">
                            <!-- Loaded through JS -->
                        </div>
                        <h3 id="album-artist"></h3>
                    </div>
                    <div class="album-footer-info">
                        <span class="album-text-label">Label:</span>
                        <div id="album-label" class="album-label"></div>
                        <div id="album-year" class="album-year"></div>
                        <div class="album-genre-style">
                            <div id="album-style" class="album-style"></div>
                            <div id="album-genre" class="album-genre"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Find album by ID -->
            <div id="search-bar" class="search-bar">
                <h1>Find an album</h1>
                <input type="search" id="album-search" placeholder="Album or artist" aria-label="Search albums" autocomplete="off">
                <ul id="search-results" class="albums-list" aria-live="polite"></ul>
                <ul id="album-list" class="albums-list">
                    <!-- Data loaded from json -->
                </ul>
            </div>

            <!-- Vibrant JS for color extraction -->
            <script src="scripting/vibrant.min.js"></script>
            
            <!-- The scripting for the album view -->
            <script type="module" src="scripting/main.js"></script>

        </main>
        <footer>
            <section class="container">
                Album data by <a href="https://musicbrainz.org/">MusicBrainz</a>, cover art by the <a href="https://coverartarchive.org/">Cover Art Archive</a>.
            </section>
        </footer>
    </body>
</html>
