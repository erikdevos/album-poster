<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Album Poster</title>
        <link rel="icon" href="data:,">
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/style.css">
        <script>
            // Set the theme before the first paint, so there is no flash of the wrong one.
            // The same rule as displayOptions.js: the URL, then the saved choice, else the system.
            try {
                var theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('album-poster.theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
            } catch (error) {}
        </script>
    </head>
    <body>
        <!-- Fixed to the window, so that loading and messages never move the page -->
        <div class="loading-line" aria-hidden="true"></div>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

        <header class="site-header">
            <h1 class="site-title">Album poster</h1>
            <div class="search" role="search">
                <input id="album-search" type="search" role="combobox" aria-expanded="false"
                       aria-controls="search-results" aria-autocomplete="list" aria-label="Search albums"
                       placeholder="Search album or artist" autocomplete="off" spellcheck="false">
                <ul id="search-results" role="listbox" aria-label="Albums" hidden></ul>
                <p id="search-status" class="sr-only" role="status"></p>
            </div>
            <select id="layout-select" class="header-control layout-select" aria-label="Poster layout">
                <option value="classic">Classic</option>
                <option value="minimal">Minimal</option>
                <option value="swiss">Swiss</option>
                <option value="blur">Blur</option>
                <option value="cd">CD</option>
                <option value="cd-blur">CD blur</option>
                <option value="festival">Festival</option>
                <option value="receipt">Receipt</option>
                <option value="gallery">Gallery</option>
                <option value="setlist">Setlist</option>
                <option value="typographic">Typographic</option>
                <option value="riso">Riso</option>
                <option value="film">Film</option>
                <option value="vinyl">Vinyl</option>
                <option value="modern">Modern</option>
            </select>
            <button id="prev-button" class="header-control icon-button browse-button" type="button" title="Previous album (left arrow)" aria-label="Previous album">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button id="next-button" class="header-control icon-button browse-button" type="button" title="Next album (right arrow)" aria-label="Next album">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button id="shuffle-button" class="header-control icon-button" type="button" title="Random album" aria-label="Random album">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <a id="wall-link" class="header-control icon-button" href="wall/" title="Wall: all albums" aria-label="Wall: all albums">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </a>
            <div class="header-menu">
                <button id="display-toggle" class="header-control icon-button" type="button" title="Display and slideshow" aria-label="Display and slideshow"
                        aria-haspopup="dialog" aria-expanded="false" aria-controls="display-panel">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                        <path d="M3 5h18v11H3zM8 20h8M12 16v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div id="display-panel" class="menu-panel" role="dialog" aria-label="Display and slideshow" hidden>
                    <button id="menu-fullscreen" class="panel-button" type="button">Full screen</button>
                    <p class="panel-heading">Slideshow</p>
                    <label class="panel-field">Change every
                        <select id="slideshow-interval">
                            <option value="5">5 seconds</option>
                            <option value="10" selected>10 seconds</option>
                            <option value="15">15 seconds</option>
                            <option value="30">30 seconds</option>
                            <option value="60">1 minute</option>
                        </select>
                    </label>
                    <label class="panel-field">Albums from
                        <select id="slideshow-source">
                            <option value="curated">Our selection</option>
                            <option value="random">Random albums</option>
                        </select>
                    </label>
                    <button id="slideshow-start" class="panel-primary" type="button">Start slideshow</button>
                </div>
            </div>
            <div class="header-menu">
                <button id="export-toggle" class="header-control icon-button" type="button" title="Export" aria-label="Export"
                        aria-haspopup="dialog" aria-expanded="false" aria-controls="export-panel">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div id="export-panel" class="menu-panel" role="dialog" aria-label="Export the poster" hidden>
                    <label class="panel-field">File type
                        <select id="export-format">
                            <option value="png">PNG</option>
                            <option value="pdf">PDF</option>
                        </select>
                    </label>
                    <label class="panel-field" id="export-quality-field">Quality
                        <select id="export-quality">
                            <option value="standard">Standard, 2400 px</option>
                            <option value="high">High, 4000 px</option>
                            <option value="maximum">Maximum, 6000 px</option>
                        </select>
                    </label>
                    <!-- Only for a PDF: the page for a printer, in print units -->
                    <div id="print-options" class="print-options" hidden>
                        <label class="panel-field">Purpose
                            <select id="print-preset"><!-- Loaded through JS --></select>
                        </label>
                        <label class="panel-field">Paper size
                            <select id="print-paper"><!-- Loaded through JS --></select>
                        </label>
                        <label class="panel-field">Orientation
                            <select id="print-orientation">
                                <option value="auto">Automatic</option>
                                <option value="portrait">Portrait</option>
                                <option value="landscape">Landscape</option>
                            </select>
                        </label>
                        <label class="panel-field">Margin
                            <select id="print-margin">
                                <option value="0">No margin</option>
                                <option value="5">5 mm</option>
                                <option value="10">10 mm</option>
                                <option value="20">20 mm</option>
                            </select>
                        </label>
                        <label class="panel-field">Print dpi
                            <select id="print-dpi">
                                <option value="150">150 dpi, draft</option>
                                <option value="300">300 dpi, print</option>
                                <option value="600">600 dpi, fine art</option>
                            </select>
                        </label>
                        <label class="panel-check"><input id="print-bleed" type="checkbox"> 3 mm bleed</label>
                        <label class="panel-check"><input id="print-marks" type="checkbox"> Crop marks</label>
                        <p id="print-summary" class="panel-note" role="status"></p>
                    </div>
                    <button id="download-button" class="panel-primary" type="button">Download</button>
                    <div class="export-more">
                        <button id="print-button" type="button">Print</button>
                        <button id="share-button" type="button">Copy link</button>
                    </div>
                </div>
            </div>
            <button id="theme-toggle" class="header-control theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>
        </header>
        <main>

            <section id="album-container" aria-label="Album poster">
                <!-- Album info -->
                <div id="album-info" class="album-info-container no-back">
                    <!-- Only visible in the blur layout: the cover, enlarged and blurred, behind the poster -->
                    <div class="poster-backdrop" aria-hidden="true"><img id="album-backdrop" src="" alt="" crossorigin="anonymous"></div>
                    <div class="album-cover-wrapper">
                        <img id="album-cover" src="" alt="" crossorigin="anonymous">
                    </div>
                    <h2 id="album-name" class="album-name"></h2>
                    <div class="album-tracklist-genre-wrapper">
                        <div class="left">
                            <ol id="track-list" class="track-list"></ol>
                        </div>
                        <div class="right">
                            <div class="album-cover-back">
                                <img id="album-cover-back" src="" alt="" crossorigin="anonymous">
                            </div>
                        </div>
                    </div>
                    <div class="album-artist">
                        <div id="album-colors" class="album-colors" aria-hidden="true">
                            <!-- Loaded through JS -->
                        </div>
                        <h3 id="album-artist"></h3>
                    </div>
                    <div class="album-footer-info">
                        <div class="footer-item hidden"><span class="album-text-label">Label:</span> <span id="album-label"></span></div>
                        <div class="footer-item hidden"><span id="album-year"></span></div>
                        <div class="footer-item hidden"><span id="album-genre"></span></div>
                        <!-- Only shown in the layouts that have room for it (modern) -->
                        <div class="footer-item footer-length hidden"><span id="album-length"></span></div>
                    </div>
                    <!-- Only visible in the cd layouts: the real barcode of the release, when MusicBrainz knows it -->
                    <div id="album-barcode" class="album-barcode hidden"></div>
                </div>
            </section>


            <!-- Shown for a moment in display mode, when the mouse moves or on a tap -->
            <div class="display-controls" role="toolbar" aria-label="Display controls">
                <button id="display-pause" class="display-button kiosk-only" type="button" title="Pause" aria-label="Pause" aria-pressed="false">
                    <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                    <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
                </button>
                <button id="display-next" class="display-button kiosk-only" type="button" title="Next album" aria-label="Next album">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M5 5l10 7-10 7zM19 5v14" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
                </button>
                <button id="display-fullscreen" class="display-button" type="button" title="Full screen" aria-label="Full screen">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button id="display-exit" class="display-button" type="button" title="Exit display mode" aria-label="Exit display mode">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="kiosk-progress" aria-hidden="true"><div class="kiosk-progress-bar"></div></div>

            <!-- Vibrant JS for color extraction -->
            <script src="scripting/vibrant.min.js"></script>

            <!-- The scripting for the album view -->
            <script type="module" src="scripting/main.js"></script>
        </main>
        <footer>
            <div class="container">
                Album data by <a href="https://musicbrainz.org/">MusicBrainz</a>, cover art by the <a href="https://coverartarchive.org/">Cover Art Archive</a>.
            </div>
        </footer>
    </body>
</html>
